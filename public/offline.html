<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0d10" media="(prefers-color-scheme: dark)">
<title>연결이 끊겼어요 · 소희</title>
<style>
:root{color-scheme:light dark;--bg:#f7f6f2;--fg:#1d1b26;--muted:#5d5a6b;--primary:#5a49d6;--on-primary:#fff;--card:#fff;--border:#e4e1d8}
@media (prefers-color-scheme:dark){:root{--bg:#0c0d10;--fg:#f1f0f5;--muted:#a9a6b8;--primary:#9b8cff;--on-primary:#14131a;--card:#16171c;--border:#2a2b33}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
main{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));max-width:440px;margin:0 auto}
.mark{width:64px;height:64px;border-radius:18px;margin-bottom:24px}
h1{font-size:24px;line-height:1.35;margin:0 0 12px;letter-spacing:-.01em}
p{font-size:16px;line-height:1.6;margin:0 0 12px;color:var(--muted)}
.note{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin:12px 0 24px}
.note strong{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
.note p{font-size:15px;margin:0}
button{appearance:none;border:0;border-radius:14px;min-height:48px;width:100%;font:600 16px/1 inherit;font-family:inherit;background:var(--primary);color:var(--on-primary);cursor:pointer}
button:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
button[aria-busy=true]{opacity:.7}
#status{min-height:24px;font-size:15px;color:var(--muted);margin-top:12px}
@media (prefers-reduced-motion:no-preference){main{animation:in .22s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<main>
  <img class="mark" src="/icons/sohee-192.png" alt="" width="64" height="64">
  <h1>네트워크에 연결할 수 없어요</h1>
  <p>마지막으로 확인한 내용은 서버에서 다시 확인해야 해요. 연결이 돌아오면 이어서 볼 수 있어요.</p>
  <div class="note">
    <strong>지금은 읽기만 안내해 드려요</strong>
    <p>보내기·예약·결제처럼 외부에 영향을 주는 일은 연결된 뒤에 확인하고 진행해요. 오프라인에서 몰래 대기시키지 않아요.</p>
  </div>
  <button id="retry" type="button">다시 연결</button>
  <div id="status" role="status" aria-live="polite"></div>
</main>
<script>
(function(){
  var btn=document.getElementById('retry'),st=document.getElementById('status');
  function go(){var t=new URLSearchParams(location.search).get('next');
    // 같은 앱 경로로만 복귀(열린 리다이렉트 방지)
    location.replace(t&&/^\/(?:app|start)(?:\/|$)/.test(t.split(/[?#]/)[0])&&t.indexOf('\\')<0&&t.indexOf('%')<0?t:'/app');}
  function check(){
    btn.setAttribute('aria-busy','true');st.textContent='연결을 확인하는 중이에요…';
    fetch('/manifest.webmanifest',{cache:'no-store'}).then(function(r){
      if(r.ok){st.textContent='연결됐어요. 돌아가는 중이에요.';go();}else{throw new Error('x')}
    }).catch(function(){st.textContent='아직 연결되지 않았어요. 잠시 뒤 다시 시도해 주세요.';}).then(function(){btn.removeAttribute('aria-busy')});
  }
  btn.addEventListener('click',check);
  window.addEventListener('online',check);
})();
</script>
</body>
</html>
